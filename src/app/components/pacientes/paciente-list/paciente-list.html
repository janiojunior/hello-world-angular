<mat-toolbar class="mat-toolbar">
  <div class="flex-container">
    <span class="toolbar-title">Controle de Pacientes</span>
    <button mat-fab class="accent" routerLink="/pacientes/new">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</mat-toolbar>

<mat-form-field appearance="outline" class="flex-container">
  <mat-label>Filtro por nome</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Maria" />
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="numero">
    <th mat-header-cell *matHeaderCellDef>Número</th>
    <td mat-cell *matCellDef="let obj; let i = index">{{ pageIndex * pageSize + i + 1 }}</td>
  </ng-container>

  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let obj">{{ obj.nome }}</td>
  </ng-container>

  <ng-container matColumnDef="cpf">
    <th mat-header-cell *matHeaderCellDef>CPF</th>
    <td mat-cell *matCellDef="let obj">{{ formatarCpf(obj.cpf) }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>E-mail</th>
    <td mat-cell *matCellDef="let obj">{{ obj.email }}</td>
  </ng-container>

  <ng-container matColumnDef="dataNascimento">
    <th mat-header-cell *matHeaderCellDef>Nascimento</th>
    <td mat-cell *matCellDef="let obj">{{ formatarData(obj.dataNascimento) }}</td>
  </ng-container>

  <ng-container matColumnDef="ativo">
    <th mat-header-cell *matHeaderCellDef>Situação</th>
    <td mat-cell *matCellDef="let obj">{{ formatarStatus(obj.ativo) }}</td>
  </ng-container>

  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef>Ação</th>
    <td mat-cell *matCellDef="let obj">
      <button mat-icon-button color="primary" routerLink="/pacientes/edit/{{obj.id}}">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="excluir(obj)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator
  [length]="totalItems"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20]"
  (page)="onPageChange($event)"
></mat-paginator>
